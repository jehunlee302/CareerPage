# Dwell-time collector Worker (Rust, compiled to WebAssembly by worker-build).
[package]
name = "cp-analytics"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
worker = "=0.9.0"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
