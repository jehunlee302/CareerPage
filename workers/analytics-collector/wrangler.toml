# CareerPage dwell-time collector Worker (Rust).
# Needs: Rust, `rustup target add wasm32-unknown-unknown`. Deploy: cd workers/analytics-collector && npx wrangler deploy
# Put the deployed URL (https://cp-analytics.<account>.workers.dev) into WORKER_URL in assets/js/analytics.js.
name = "cp-analytics"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[[analytics_engine_datasets]]
binding = "AE"
dataset = "careerpage_dwell"
