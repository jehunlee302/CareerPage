    situation:
      en: Mass-personalization production requires integrated control of distributed, heterogeneous equipment — 3D printers, robotic handlers, IoT sensors — but no unified platform existed for such an environment.
      ko: 개인맞춤형 생산(Mass Personalization) 환경에서는 3D 프린터·로봇 핸들러·IoT 센서로 구성된 분산 이기종 설비를 통합 제어할 수 있는 플랫폼이 필요했다.
    purpose:
      en: Build an IoT service platform that integrates heterogeneous equipment under the Factory-as-a-Service (FaaS) concept.
      ko: FaaS(Factory-as-a-Service) 관점에서 이기종 설비를 통합 제어하는 IoT 서비스 플랫폼을 구축한다.
    role:
      en: Researcher — responsible for the 3D-printer Urban Factory scheduling simulator and algorithm development.
      ko: 연구원 — 3D 프린터 도시 공장(Urban Factory) 스케줄링 시뮬레이터 구축 및 알고리즘 개발을 담당하였다.
    tasks:
      - en: Built the 3D-printer Urban Factory scheduling simulator and the initial scheduling algorithm
        ko: 3D 프린터 도시 공장 스케줄링 시뮬레이터를 구축하고 초기 스케줄링 알고리즘을 개발하였다
      - en: Developed rescheduling algorithms for disruption response
        ko: 이상 상황 대응 리스케줄링 알고리즘을 개발하였다
      - en: Reviewed robot-handler operation algorithms
        ko: 로봇 핸들러 운영 알고리즘을 검토하였다
      - en: Defined data schema and supported integration of the scheduling algorithm into the product
        ko: 데이터 스키마를 정의하고 스케줄링 알고리즘의 제품 이식을 지원하였다
    achievements:
      en: Accumulated experience operating a large multi-institution government project that integrated distributed heterogeneous equipment under FaaS principles.
      ko: 이기종 설비(3D 프린터·로봇 핸들러·IoT 센서)로 구성된 분산 생산 시스템을 FaaS 관점에서 통합 제어한 대형 다기관 정부 과제 수행 경험을 축적하였다.
    notes:
      en: "Partners: SKKU, ETRI, Yonsei University, HyVISIONsystem, CoeverI&T, PartDB, LatisGlobal Communications."
      ko: "협력기관: 성균관대학교, ETRI(한국전자통신연구원), 연세대학교, HyVISIONsystem, CoeverI&T, PartDB, LatisGlobal Communications."
  remarks:
    en: Scheduling/rescheduling algorithms for flexible production automation
    ko: 유연 생산 자동화용 스케줄링/리스케줄링 알고리즘 설계/개발
